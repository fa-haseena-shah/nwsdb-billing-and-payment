<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Sri Lankan NWSDB</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="scripts/api.js"></script>
    <script defer src="scripts/auth.js"></script>
    <script defer src="scripts/views.js"></script>
</head>
<body>
  <main class="page">
    <header class="brand">
      <a href="index.html" class="brand-logo-slot" aria-label="Home">
        <img src="assets/icon_logo.png" alt="Logo" style="height: 120px;">
      </a>
      <div class="welcome">WELCOME BACK</div>
      <h1>Sri Lankan NWSDB</h1>
    </header>

    <section class="auth-card">
      <div id="message" class="message" role="alert"></div>
      <form id="loginForm" class="auth-form active-form">
        <div class="field">
          <label for="loginEmail">Email</label>
          <input id="loginEmail" name="email" type="email" autocomplete="email" required>
        </div>

        <div class="field">
          <label for="loginPassword">Password</label>
          <input id="loginPassword" name="password" type="password"
                 autocomplete="current-password" required>
        </div>

        <button class="submit-btn" type="submit">Login</button>
      </form>
      <p class="login-link">
        No acccount?
        <a href="register.html">Register</a>
      </p>
    </section>
  </main>
</body>
</html>
