<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pay Bill</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="scripts/api.js"></script>
    <script defer src="scripts/auth.js"></script>
    <script defer src="scripts/views.js"></script>
</head>
<body>
    <div class="pay-bill-page">
        <div class="pay-bill-header">
            <div class="logo-container">
                <a href="dashboard.html">
                    <img src="assets/nwsdb_logo.png" alt="Logo">
                </a>
            </div>
            <h1>Paying Bill</h1>
        </div>

        <div class="pay-bill-content">
            <div class="bill-summary">
                <h2 id="acc-no-display">Acc No</h2>
                <div class="bill-detail">
                    <span>Bill Id</span>
                    <span id="bill-id-display"></span>
                </div>
                <div class="bill-detail">
                    <span>Units Used</span>
                    <span id="units-used-display"></span>
                </div>
                <div class="bill-total">
                    <strong>Total</strong>
                    <strong id="total-payable-display"></strong>
                </div>
            </div>
            <div class="payment-form-box">
                <div class="payment-field">
                    <label for="cardNumber">Card Number</label>
                    <input type="text" id="cardNumber" name="cardNumber" maxlength="19">
                </div>

                <div class="payment-field">
                    <label for="cardHolder">Card Holder Name</label>
                    <input type="text" id="cardHolder" name="cardHolder">
                </div>
                <div class="card-small-fields">
                    <div class="payment-field">
                        <label for="expiryDate">Expiry Date</label>
                        <input type="text" id="expiryDate" name="expiryDate" placeholder="MM/YY">
                    </div>
                    <div class="payment-field">
                        <label for="cvv">CVV</label>
                        <input type="password" id="cvv" name="cvv" maxlength="3">
                    </div>
                </div>
            </div>
        </div>
        <div class="pay-bill-actions">
            <button class="pay-back-btn" id="backBtn">Back</button>
            <button class="pay-submit-btn" id="payBtn" disabled>Pay</button>
        </div>
    </div>
</body>
</html>
